name: my_bismuth_wallet
description: Bismuth Wallet app (iOS/Android).

publish_to: 'none'

version: 1.8.4+60

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.4

  # Securely store data in a keystore
  flutter_secure_storage: ^9.2.4

  # Shared prefs
  shared_preferences: ^2.0.8

  # Websockets
  web_socket_channel: ^2.1.0

  # Platform-specific build info
  package_info_plus: ^8.3.0

  # Localization
  intl: ^0.20.2

  # BigDecimal alternative
  decimal: ^1.5.0

  # Logger
  logger: ^1.1.0

  # BIP32/39 for wallet functionality
  bip32: ^2.0.0
  bip39: ^1.0.6
  
  # Hive database
  hive: ^2.0.4
  hive_flutter: ^1.1.0

  # TouchID/FaceID
  local_auth: ^2.1.2
 
  # Event bus
  event_taxi: ^1.0.0

  # SVG support
  flutter_svg: ^1.1.6
  
  # FFI for native functions
  ffi: ^2.0.1

  # QR Codes
  qr_flutter: ^4.0.0

  # QR code scanning (upgraded for better device compatibility)
  mobile_scanner: ^7.0.1

  # HTTP client
  http: ^0.13.4

  # Hex encoding/decoding
  hex: ^0.2.0

  # Cryptography
  pointycastle: ^3.4.0

  # Toast messages
  oktoast: ^3.1.5

  # Slidable list actions
  flutter_slidable: ^3.1.1

  # Lock helper
  synchronized: ^3.0.0

  # Service provider
  get_it: ^7.2.0
  
  # Utilities
  convert: ^3.0.1

  # Base58 encoding
  bs58check: ^1.0.2

  # Validation utilities
  validators: ^3.0.0

  # Auto resize text widget
  auto_size_text: ^3.0.0

  # Hash functions
  hash:  
    git: 
      url: https://github.com/redDwarf03/hash.git
      ref: master

  # Base58 encoding
  fast_base58: ^0.2.1
  
# Dev dependencies

# Removed unnecessary packages like animations, UI components, deep linking
# Additional packages may be evaluated after core features

  # flutter_vibrate: ^1.3.0 - removed due to AGP 8+ compatibility issues
  # Use HapticFeedback.vibrate() instead
  quiver: ^3.2.1
  diacritic: ^0.1.5
  
  webview_flutter: ^4.8.0
  fluttericon: ^2.0.0
  # flare_flutter: ^3.0.2  # Deprecated - removed due to hashValues compatibility issues
  asn1lib: ^1.5.3
  # keyboard_avoider: ^0.1.2  # Not null-safe, replaced with SingleChildScrollView
dev_dependencies:
  build_runner: ^2.1.4
  flutter_test:
    sdk: flutter
  # A build system for Dart code generation and modular compilation
  hive_generator: ^1.1.1
  # Automatically organize your dart imports
  import_sorter: ^4.6.0
  # Contains code to deal with internationalized/localized messages, date and number formatting and parsing, bi-directional text, and other internationalization issues.
  
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_serializable: ^6.0.1
  
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon_my_bismuth_wallet.png"

# The following section is specific to Flutter.
flutter:
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Bold.ttf
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 400
    - family: NunitoSans
      fonts:
        - asset: fonts/NunitoSans-Regular.ttf
          weight: 600
        - asset: fonts/NunitoSans-ExtraLight.ttf
          weight: 100
        - asset: fonts/NunitoSans-Light.ttf
          weight: 200
        - asset: fonts/NunitoSans-SemiBold.ttf
          weight: 700
        - asset: fonts/NunitoSans-Bold.ttf
          weight: 800
        - asset: fonts/NunitoSans-ExtraBold.ttf
          weight: 900
    - family: OverpassMono
      fonts:
        - asset: fonts/OverpassMono-Regular.ttf
          weight: 600
        - asset: fonts/OverpassMono-Light.ttf
          weight: 100
    - family: AppIcons
      fonts:
        - asset: fonts/AppIcons.ttf
          weight: 500
    - family: Comfortaa
      fonts:
        - asset: fonts/Comfortaa-Bold.ttf
          weight: 700
        - asset: fonts/Comfortaa-Regular.ttf
          weight: 400
        - asset: fonts/Comfortaa-Light.ttf
          weight: 300
  assets:
    - assets/QR.svg
    - assets/icon.png
    - assets/sharecard_logo.svg

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  
